name: PawLog
options:
  bundleIdPrefix: com.junjia.pawlog
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6HRM8RJ78G
    # 色板符号不在代码里用:颜色常量集中在 DesignTokens.swift(按名取色,两 target 都能用),
    # 避免 app/appex 生成符号行为不一致导致编译失败
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
targets:
  PawLog:
    type: application
    platform: iOS
    sources:
      - path: PawLog
      - path: Shared
    info:
      path: PawLog/Info.plist
      properties:
        CFBundleName: PawLog
        CFBundleDisplayName: PawLog
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 需要相机权限来拍摄宠物照片
        NSPhotoLibraryUsageDescription: 用于从相册选择宠物照片
        NSPhotoLibraryAddUsageDescription: 用于保存生成的对比图和成长视频到相册
    entitlements:
      path: PawLog/PawLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.junjia.pawlog.shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.junjia.pawlog
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PawLogWidget
        embed: true
  PawLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PawLogWidget
      - path: Shared
    info:
      path: PawLogWidget/Info.plist
      properties:
        CFBundleName: PawLogWidget
        CFBundleDisplayName: PawLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PawLogWidget/PawLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.junjia.pawlog.shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.junjia.pawlog.widget
      SKIP_INSTALL: YES
